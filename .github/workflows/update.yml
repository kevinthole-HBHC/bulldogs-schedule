name: Update game schedule

on:
  schedule:
    - cron: "17 * * * *"     # every hour
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TeamSnap feeds and keep games
        env:
          TEAMSNAP_FEED_VARSITY: ${{ secrets.TEAMSNAP_FEED_VARSITY }}
          TEAMSNAP_FEED_JV: ${{ secrets.TEAMSNAP_FEED_JV }}
        run: python3 scripts/update_games.py
      - name: Save changes
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add games.ics
          git diff --cached --quiet || (git commit -m "Update game schedule" && git push)
