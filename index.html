<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highland Bulldogs games</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#16181C;overflow:hidden}
  #hb-bar{
    --bg:#16181C; --card:#16181C; --hover:#1F2329; --line:#2C3036; --ink:#F2F3F5; --muted:#9AA1AA; --red:#E21B35;
    height:112px; box-sizing:border-box; display:flex; background:var(--bg); color:var(--ink);
    border-bottom:3px solid var(--red); font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  }
  #hb-bar *{box-sizing:border-box}
  .hb-arrow{flex:0 0 32px; border:0; background:var(--bg); color:var(--muted); font-size:28px; cursor:pointer; padding:0}
  .hb-arrow:hover{color:#fff}
  .hb-arrow:focus-visible,.hb-cal:focus-visible,.hb-track:focus-visible{outline:2px solid var(--red); outline-offset:-2px}
  .hb-track{flex:1; display:flex; overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none; border-left:1px solid var(--line)}
  .hb-track::-webkit-scrollbar{display:none}
  .hb-item{display:flex; flex:0 0 auto; border-right:1px solid var(--line)}
  .hb-date{width:50px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-right:1px solid var(--line); line-height:1; text-transform:uppercase; background:#121418}
  .hb-date .wd{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.04em}
  .hb-date .mo{font-size:16px; font-weight:700; margin-top:5px}
  .hb-date .dy{font-size:24px; font-weight:700; margin-top:2px}
  .hb-game{width:212px; padding:8px 12px 6px; text-decoration:none; color:inherit; position:relative; display:block}
  .hb-game:hover{background:var(--hover)}
  .hb-next .hb-game::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--red)}
  .hb-top{display:flex; justify-content:space-between; align-items:center; height:16px; font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase}
  .hb-pill{background:var(--line); color:var(--ink); border-radius:3px; padding:1px 6px; font-weight:700}
  .hb-next .hb-pill{background:var(--red)}
  .hb-team{color:var(--muted)}
  .hb-row{display:flex; align-items:center; gap:8px; height:24px; margin-top:5px; font-size:18px; font-weight:700; white-space:nowrap}
  .hb-row:first-of-type{margin-top:6px}
  .hb-badge{flex:0 0 24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:9px; font-weight:700; background:#3A3F46; color:#fff; letter-spacing:.02em}
  .hb-badge.long{font-size:7.5px; letter-spacing:0}
  .hb-badge.us{background:var(--red)}
  .hb-name{overflow:hidden; text-overflow:ellipsis}
  .hb-row.us .hb-name{color:#fff}
  .hb-row .side{margin-left:auto; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.04em}
  .hb-row .score{margin-left:auto; font-size:20px; font-weight:700; color:var(--muted); min-width:18px; text-align:right}
  .hb-row.win .score,.hb-row.win .hb-name{color:#fff}
  .hb-row.lose .hb-name{color:var(--muted)}
  .hb-final .hb-pill{background:transparent; color:var(--ink); padding:0}
  .hb-rink{margin-top:6px; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center}
  .hb-past{opacity:.5}
  .hb-cancel .hb-pill{background:transparent; color:var(--red); padding:0}
  .hb-cal{flex:0 0 64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--ink); text-decoration:none; border-left:1px solid var(--line); font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase}
  .hb-cal:hover{background:var(--hover); color:#fff}
  .hb-cal svg{width:26px; height:26px}
  .hb-msg{padding:0 18px; align-self:center; font-size:16px; color:var(--muted)}
  @media (max-width:600px){ .hb-game{width:186px} .hb-cal{flex-basis:52px} .hb-cal span{display:none} .hb-arrow{flex-basis:26px} }
  @media (prefers-reduced-motion:reduce){ .hb-track{scroll-behavior:auto} }
</style>
</head>
<body>
<div id="hb-bar" aria-label="Upcoming games">
  <button class="hb-arrow hb-prev" aria-label="Earlier games">&#8249;</button>
  <div class="hb-track" tabindex="0"><div class="hb-msg">Loading schedule…</div></div>
  <button class="hb-arrow hb-next" aria-label="Later games">&#8250;</button>
  <a class="hb-cal" href="calendar.html" target="_blank" rel="noopener" title="Full schedule calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
      <path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/></svg>
    <span>Calendar</span>
  </a>
</div>
<script src="games.js"></script>
<script>
(function(){
  /* Optional: ?team=varsity or ?team=jv shows one team only.
     ?cal=<address> sends the calendar button somewhere else (for example a page on the club site). */
  var params = new URLSearchParams(location.search);
  var ONLY = (params.get("team") || "").toLowerCase();
  var root = document.getElementById("hb-bar"), track = root.querySelector(".hb-track");
  var calLink = root.querySelector(".hb-cal");
  if (params.get("cal")){ calLink.href = params.get("cal"); calLink.target = "_top"; }
  else if (ONLY){ calLink.href = "calendar.html?team=" + encodeURIComponent(ONLY); }
  var C = HB.CONFIG, esc = HB.esc;

  function badge(text, us){
    return '<span class="hb-badge' + (us ? ' us' : '') + (text.length > 3 ? ' long' : '') + '">' + esc(text) + '</span>';
  }
  function row(isUs, g){
    var scored = g.result != null, mine = isUs ? g.us : g.them, theirs = isUs ? g.them : g.us;
    var cls = "hb-row" + (isUs ? " us" : "") + (scored ? (mine > theirs ? " win" : mine < theirs ? " lose" : "") : "");
    var right = scored ? '<span class="score">' + mine + '</span>' : (isUs ? '<span class="side">' + (g.home ? 'HOME' : 'AWAY') + '</span>' : '');
    var name = isUs ? C.US_NAME : g.opp;
    return '<div class="' + cls + '">' + badge(isUs ? C.US_ABBR : g.oppAbbr, isUs) + '<span class="hb-name">' + esc(name) + '</span>' + right + '</div>';
  }
  function item(g, isNext, isPast){
    var scored = g.result != null;
    var status = g.cancelled ? "Canceled" : scored ? "Final" + (g.note ? " / " + g.note : "") : isPast ? "Played" : g.time;
    var cls = "hb-item" + (isNext ? " hb-next" : "") + (isPast && !scored ? " hb-past" : "") + (scored ? " hb-final" : "") + (g.cancelled ? " hb-cancel" : "");
    // away team on top, home team underneath
    var rows = g.home ? row(false, g) + row(true, g) : row(true, g) + row(false, g);
    return '<div class="' + cls + '">'
      + '<div class="hb-date"><span class="wd">' + g.weekday + '</span><span class="mo">' + g.month + '</span><span class="dy">' + g.day + '</span></div>'
      + '<a class="hb-game" href="' + g.map + '" target="_blank" rel="noopener" title="' + esc(g.rink + (g.address ? ", " + g.address : "")) + '">'
      +   '<div class="hb-top"><span class="hb-pill">' + (isNext && !g.cancelled ? 'Next · ' : '') + status + '</span><span class="hb-team">' + esc(g.team) + '</span></div>'
      +   rows
      +   '<div class="hb-rink">' + esc(g.rink) + '</div>'
      + '</a></div>';
  }

  HB.loadGames().then(function(games){
    if (ONLY) games = games.filter(function(g){ return g.team.toLowerCase() === ONLY; });
    if (!games.length){ track.innerHTML = '<div class="hb-msg">No games scheduled yet.</div>'; return; }
    var now = new Date(), seen = {}, firstNext = -1;
    var isNext = games.map(function(g,i){
      if (g.cancelled || g.end < now || seen[g.team]) return false;
      seen[g.team] = true; if (firstNext < 0) firstNext = i; return true;
    });
    track.innerHTML = games.map(function(g,i){ return item(g, isNext[i], g.end < now); }).join("");
    var target = track.children[firstNext >= 0 ? Math.max(firstNext - 1, 0) : games.length - 1];
    if (target){ track.style.scrollBehavior = "auto"; track.scrollLeft = target.offsetLeft - track.offsetLeft; track.style.scrollBehavior = ""; }
  }).catch(function(){
    track.innerHTML = '<div class="hb-msg">Schedule is unavailable right now. Please check back soon.</div>';
  });

  function step(dir){ track.scrollBy({left: dir * track.clientWidth * 0.8}); }
  root.querySelector(".hb-prev").addEventListener("click", function(){ step(-1); });
  root.querySelector(".hb-next").addEventListener("click", function(){ step(1); });
})();
</script>
</body>
</html>
