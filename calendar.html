<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highland Bulldogs Hockey – Game Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F4F5F7; --paper:#fff; --ink:#1C1F24; --muted:#6B7280; --line:#E2E5E9; --red:#9B270C; --red-soft:#F8ECE8; --dark:#16181C}
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:Barlow,"Segoe UI",Arial,sans-serif}
  header{background:var(--dark); color:#fff; border-bottom:4px solid var(--red)}
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px}
  header .wrap{display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:72px; flex-wrap:wrap; padding-top:10px; padding-bottom:10px}
  h1{margin:0; font-family:"Barlow Condensed",Arial Narrow,sans-serif; font-weight:700; font-size:30px; letter-spacing:.02em; text-transform:uppercase}
  h1 span{color:#9AA1AA; font-weight:600}
  .seg{display:inline-flex; border:1px solid #3A3F46; border-radius:6px; overflow:hidden}
  .seg button{background:transparent; color:#C9CDD3; border:0; padding:8px 16px; font:600 15px "Barlow Condensed",sans-serif; letter-spacing:.06em; text-transform:uppercase; cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--red); color:#fff}
  main.wrap{padding-top:24px; padding-bottom:40px}
  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
  .nav{display:flex; align-items:center; gap:8px}
  .nav button{background:var(--paper); border:1px solid var(--line); border-radius:6px; height:40px; min-width:40px; font-size:20px; cursor:pointer; color:var(--ink)}
  .nav button:disabled{opacity:.35; cursor:default}
  .nav .today{font:600 15px Barlow,sans-serif; padding:0 14px}
  h2{margin:0 6px; font-family:"Barlow Condensed",sans-serif; font-size:34px; font-weight:700; min-width:230px; text-align:center}
  .legend{display:flex; gap:16px; color:var(--muted); font-size:14px}
  .legend i{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:6px}
  .legend .h{background:var(--red)} .legend .a{background:var(--paper); border:2px solid #9AA1AA}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .dow{font-family:"Barlow Condensed",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:center; padding:4px 0}
  .cell{background:var(--paper); border:1px solid var(--line); border-radius:8px; min-height:118px; padding:6px; display:flex; flex-direction:column; gap:5px}
  .cell.out{background:transparent; border-style:dashed; border-color:#E8EAED}
  .cell.today{border:2px solid var(--ink)}
  .num{font-weight:600; font-size:14px; color:var(--muted)}
  .chip{display:block; width:100%; text-align:left; border:1px solid #CDD1D6; border-left:4px solid #9AA1AA; background:var(--paper); border-radius:5px; padding:5px 7px; cursor:pointer; font:inherit; color:inherit}
  .chip.home{background:var(--red-soft); border-color:#EBCBC2; border-left-color:var(--red)}
  .chip:hover{box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .chip:focus-visible{outline:2px solid var(--red); outline-offset:1px}
  .chip .t{font-size:12px; font-weight:600; color:var(--muted); display:flex; justify-content:space-between}
  .chip .t b{color:var(--red); font-weight:600; letter-spacing:.04em; text-transform:uppercase}
  .chip .o{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:17px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip .o small{font-family:Barlow,sans-serif; font-weight:500; font-size:12px; color:var(--muted); margin-right:3px}
  .chip.past{opacity:.55}
  .chip .t .res{color:var(--ink); font-weight:700}
  .chip .t .res.W{color:#157A3B} .chip .t .res.L{color:var(--red)}
  .chip.cancel .o{text-decoration:line-through}
  .list{display:none}
  .empty{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:30px; text-align:center; color:var(--muted)}
  footer{color:var(--muted); font-size:13px; text-align:center; padding-bottom:30px}
  dialog{border:0; border-radius:12px; padding:0; width:min(420px, 92vw); box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(10,12,15,.55)}
  .dlg-head{background:var(--dark); color:#fff; padding:16px 20px; border-bottom:4px solid var(--red)}
  .dlg-head .d{font-size:14px; color:#C9CDD3}
  .dlg-head .m{font-family:"Barlow Condensed",sans-serif; font-size:28px; font-weight:700; margin-top:4px; line-height:1.1}
  .dlg-body{padding:16px 20px 20px; display:grid; gap:10px; font-size:15px}
  .dlg-body .k{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:600}
  .dlg-actions{display:flex; gap:10px; margin-top:6px}
  .btn{flex:1; text-align:center; padding:10px; border-radius:6px; font-weight:600; text-decoration:none; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; font:600 15px Barlow,sans-serif}
  .btn.primary{background:var(--red); border-color:var(--red); color:#fff}
  @media (max-width:760px){
    .grid,.dows{display:none} .list{display:grid; gap:8px}
    .day{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:grid; grid-template-columns:56px 1fr; gap:10px; align-items:start}
    .day .dl{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; text-align:center; line-height:1}
    .day .dl span{display:block; font-size:13px; color:var(--muted); font-weight:600}
    .day .dl b{display:block; font-size:28px}
    .day .games{display:grid; gap:6px}
    h1{font-size:24px} h2{font-size:28px; min-width:0}
  }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Highland Bulldogs <span>Game Calendar</span></h1>
  <div class="seg" role="group" aria-label="Show team">
    <button data-team="" aria-pressed="true">All</button><button data-team="varsity" aria-pressed="false">Varsity</button><button data-team="jv" aria-pressed="false">JV</button>
  </div>
</div></header>
<main class="wrap">
  <div class="toolbar">
    <div class="nav">
      <button class="prev" aria-label="Previous month">&#8249;</button>
      <h2 id="month" aria-live="polite">Loading…</h2>
      <button class="next" aria-label="Next month">&#8250;</button>
      <button class="today">Today</button>
    </div>
    <div class="legend"><span><i class="h"></i>Home</span><span><i class="a"></i>Away</span></div>
  </div>
  <div class="grid dows" aria-hidden="true"></div>
  <div class="grid" id="grid"></div>
  <div class="list" id="list"></div>
</main>
<footer>Updated hourly from TeamSnap. Times are Central.</footer>
<dialog id="dlg"></dialog>

<script src="games.js"></script>
<script>
(function(){
  var esc = HB.esc, C = HB.CONFIG;
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var params = new URLSearchParams(location.search);
  var state = { team: (params.get("team") || "").toLowerCase(), y: 0, m: 0, games: [], min: null, max: null };
  var gridEl = document.getElementById("grid"), listEl = document.getElementById("list"), dlg = document.getElementById("dlg");
  document.querySelector(".dows").innerHTML = DOW.map(function(d){ return '<div class="dow">' + d + '</div>'; }).join("");

  function todayKey(){ return HB.dayKey(new Date()); }
  function shown(){ return state.games.filter(function(g){ return !state.team || g.team.toLowerCase() === state.team; }); }
  function ym(key){ var p = key.split("-"); return {y:+p[0], m:+p[1]-1}; }
  function cmp(a,b){ return a.y*12+a.m - (b.y*12+b.m); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  function chip(g, i){
    var now = new Date();
    var scored = g.result != null;
    var cls = "chip" + (g.home ? " home" : "") + (g.end < now && !scored ? " past" : "") + (g.cancelled ? " cancel" : "");
    var when = g.cancelled ? "Canceled" : scored ? '<span class="res ' + g.result + '">' + g.result + ' ' + g.us + '-' + g.them + (g.note ? ' ' + esc(g.note) : '') + '</span>' : g.time;
    return '<button class="' + cls + '" data-i="' + i + '">'
      + '<div class="t"><span>' + when + '</span><b>' + esc(g.team) + '</b></div>'
      + '<div class="o"><small>' + (g.home ? "vs" : "@") + '</small>' + esc(g.opp) + '</div></button>';
  }

  function render(){
    var games = shown(), byDay = {};
    games.forEach(function(g){ (byDay[g.key] = byDay[g.key] || []).push(g); });
    document.getElementById("month").textContent = MONTHS[state.m] + " " + state.y;
    var cur = {y:state.y, m:state.m};
    document.querySelector(".prev").disabled = state.min && cmp(cur, state.min) <= 0;
    document.querySelector(".next").disabled = state.max && cmp(cur, state.max) >= 0;

    var first = new Date(state.y, state.m, 1).getDay(), days = new Date(state.y, state.m + 1, 0).getDate();
    var cells = [], tk = todayKey(), list = [];
    for (var i = 0; i < first; i++) cells.push('<div class="cell out"></div>');
    for (var d = 1; d <= days; d++){
      var key = state.y + "-" + pad(state.m + 1) + "-" + pad(d), gs = byDay[key] || [];
      cells.push('<div class="cell' + (key === tk ? ' today' : '') + '"><div class="num">' + d + '</div>'
        + gs.map(function(g){ return chip(g, state.games.indexOf(g)); }).join("") + '</div>');
      if (gs.length){
        var wd = DOW[new Date(state.y, state.m, d).getDay()];
        list.push('<div class="day"><div class="dl"><span>' + wd + '</span><b>' + d + '</b></div><div class="games">'
          + gs.map(function(g){ return chip(g, state.games.indexOf(g)); }).join("") + '</div></div>');
      }
    }
    while (cells.length % 7) cells.push('<div class="cell out"></div>');
    gridEl.innerHTML = cells.join("");
    listEl.innerHTML = list.length ? list.join("") : '<div class="empty">No games this month.</div>';
  }

  function openGame(g){
    var away = g.home ? g.opp : C.US_NAME, home = g.home ? C.US_NAME : g.opp;
    dlg.innerHTML = '<div class="dlg-head"><div class="d">' + esc(g.longDate) + ' &middot; ' + (g.cancelled ? 'Canceled' : esc(g.time)) + '</div>'
      + '<div class="m">' + esc(away) + ' @ ' + esc(home) + '</div></div>'
      + '<div class="dlg-body">'
      + (g.result != null ? '<div><div class="k">Final' + (g.note ? ' (' + esc(g.note) + ')' : '') + '</div><b style="font-size:20px">'
          + (g.result === "W" ? "Win" : g.result === "L" ? "Loss" : "Tie") + ' ' + g.us + '-' + g.them + '</b></div>' : '')
      + '<div><div class="k">Team</div>' + esc(C.US_NAME + " " + g.team) + ' &middot; ' + (g.home ? "Home" : "Away") + '</div>'
      + '<div><div class="k">Rink</div>' + esc(g.rink) + (g.address ? '<br>' + esc(g.address) : '') + '</div>'
      + (g.arrive ? '<div><div class="k">Arrival</div>' + esc(g.arrive.charAt(0).toUpperCase() + g.arrive.slice(1)) + '</div>' : '')
      + '<div class="dlg-actions"><a class="btn primary" href="' + g.map + '" target="_blank" rel="noopener">Directions</a>'
      + '<button class="btn" value="close">Close</button></div></div>';
    dlg.querySelector('button[value="close"]').onclick = function(){ dlg.close(); };
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  }
  dlg.addEventListener("click", function(e){ if (e.target === dlg) dlg.close(); });

  document.addEventListener("click", function(e){
    var c = e.target.closest && e.target.closest(".chip");
    if (c) openGame(state.games[+c.getAttribute("data-i")]);
  });
  function move(n){ var d = new Date(state.y, state.m + n, 1); state.y = d.getFullYear(); state.m = d.getMonth(); render(); }
  document.querySelector(".prev").onclick = function(){ move(-1); };
  document.querySelector(".next").onclick = function(){ move(1); };
  document.querySelector(".today").onclick = function(){ var t = ym(todayKey()); state.y = t.y; state.m = t.m; render(); };
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function(b){
    b.setAttribute("aria-pressed", String(b.getAttribute("data-team") === state.team));
    b.onclick = function(){
      state.team = b.getAttribute("data-team");
      Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      render();
    };
  });

  HB.loadGames().then(function(games){
    state.games = games;
    var start;
    if (games.length){
      state.min = ym(games[0].key); state.max = ym(games[games.length - 1].key);
      var now = new Date(), next = games.filter(function(g){ return g.end >= now && !g.cancelled; })[0];
      start = ym((next || games[games.length - 1]).key);
      var t = ym(todayKey());
      if (cmp(t, state.min) >= 0 && cmp(t, state.max) <= 0 && cmp(t, start) > 0) start = t;
    } else start = ym(todayKey());
    state.y = start.y; state.m = start.m; render();
  }).catch(function(){
    document.getElementById("month").textContent = "Schedule unavailable";
    gridEl.innerHTML = ""; listEl.innerHTML = '<div class="empty">The schedule could not be loaded. Please try again later.</div>';
  });
})();
</script>
</body>
</html>
